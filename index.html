<!DOCTYPE html>
<html>
<head>
    <title>My CSS Page</title>

    <!-- Internal CSS - Task 1 -->
    <style>
        h1 {
            background-color: gray;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">

</head>
<body>

    <!-- TASK 1: Three Ways to Add CSS -->

    <h1 style="color: red;">My CSS Page</h1>

    <p>This is my first CSS page.</p>


    <!-- TASK 2: ID and Class -->

    <h2 id="title">Welcome to My Website</h2>

    <div class="card">
        Tahira Batool
    </div>


    <!-- TASK 4: Position and Layout -->

    <h2>Position and Layout</h2>

    <div class="box">
        <span class="badge">NEW</span>
        <h3>CSS Position Box</h3>
        <p>This box uses relative positioning.</p>
    </div>


    <!-- Flex Layout -->

    <h2>Flex Layout</h2>

    <div class="flex-container">

        <div class="item">Box 1</div>

        <div class="item">Box 2</div>

        <div class="item">Box 3</div>

    </div>


    <!-- Grid Layout -->

    <h2>Grid Layout</h2>

    <div class="grid-container">

        <div class="item">Box 1</div>

        <div class="item">Box 2</div>

        <div class="item">Box 3</div>

        <div class="item">Box 4</div>

        <div class="item">Box 5</div>

        <div class="item">Box 6</div>

    </div>

</body>
</html>
